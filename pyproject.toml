[project]
name = "clickedu-mcp"
version = "0.1.0"
description = "Personal stdio MCP server for a Clickedu teacher account (read + gated write)."
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "curl-cffi>=0.7",
    "lxml>=6.1.3",
    "mcp>=1.2,<2",
    "python-dotenv>=1.2.4",
]

[project.scripts]
clickedu-mcp = "clickedu_mcp.server:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
